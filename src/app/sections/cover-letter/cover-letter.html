<section class="cover-letter" @fadeUp>
  <h2>
    {{ languageService.currentLanguage() === 'es' ? 'Carta de presentación' : 'Cover letter' }}
  </h2>
  <div class="divider" aria-hidden="true"></div>

  <div class="body">
    @if (html(); as content) {
      <div [innerHTML]="content"></div>
    } @else if (loading()) {
      <p class="status">
        {{ languageService.currentLanguage() === 'es' ? 'Cargando…' : 'Loading…' }}
      </p>
    }
  </div>
</section>
