<section class="projects" @fadeUp>
  <h2>{{ languageService.currentLanguage() === 'es' ? 'Proyectos Personales' : 'Personal Projects' }}</h2>

  <div class="timeline">
    <div class="timeline-item" *ngFor="let item of languageService.data().projects">
      <div class="period">{{ item.period }}</div>
      <div class="content">
        <h3>{{ item.title }}</h3>
        <ul class="highlights" *ngIf="item.highlights.length">
          <li *ngFor="let point of item.highlights">{{ point }}</li>
        </ul>
        <div class="tech-list" *ngIf="item.technologies.length">
          <span class="tech-chip" *ngFor="let tech of item.technologies">{{ tech }}</span>
        </div>
        <a class="project-link" *ngIf="item.link" [href]="item.link" target="_blank" rel="noopener">{{ item.link }}</a>
      </div>
    </div>
  </div>
</section>
